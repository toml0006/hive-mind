[project]
name = "hive-mind"
version = "0.1.0"
description = "Temporal, project-scoped decision memory for coding agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "neo4j>=5.26",
    "pyyaml>=6",
    "mcp>=1.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
semantic = ["graphiti-core>=0.29,<0.30"]

[project.urls]
Documentation = "https://github.com/toml0006/hive-mind#readme"
Issues = "https://github.com/toml0006/hive-mind/issues"
Source = "https://github.com/toml0006/hive-mind"

[project.scripts]
hive-mind-mcp = "hive_mind.mcp:main"
hive-mind-ground = "hive_mind.ground:main"
hive-mind-harvest = "hive_mind.extract:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.private",
    "/.pytest_cache",
    "/.remember",
    "/.ruff_cache",
    "/.uv-cache",
    "/.venv",
    "/build",
    "/dist",
    "/repos.local.yaml",
    "/web/.next",
    "/web/.vinext",
    "/web/.wrangler",
    "/web/dist",
    "/web/node_modules",
]

[tool.hatch.build.targets.wheel]
packages = ["hive_mind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: requires a running Neo4j at bolt://localhost:7687",
    "slow: also requires a configured semantic provider and the Codex CLI",
]
