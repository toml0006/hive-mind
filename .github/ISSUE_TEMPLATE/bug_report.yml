name: Bug report
description: Report a reproducible problem using synthetic data
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real memory, client names, transcripts, emails,
        credentials, or private repository mappings. Report security or privacy
        issues privately using SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and include the smallest useful example.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Canonical store or temporal model
        - MCP tools
        - Hooks or candidate extraction
        - Scope isolation
        - Web app
        - Semantic provider
        - Documentation or packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Neo4j, Node, and relevant provider versions.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all private data and credentials from this report.
          required: true
