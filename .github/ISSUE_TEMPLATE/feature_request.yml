name: Feature request
description: Propose an improvement or extension
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What contributor or user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Temporal, scope, and privacy impact
      description: Explain any effect on history, supersession, isolation, or sensitive data.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: contribution
    attributes:
      label: Are you interested in implementing this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
